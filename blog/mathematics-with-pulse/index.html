                                            ${comparison.euler.tools.map(tool => `<span style="background: rgba(50, 50, 70, 0.7); border-radius: 20px; padding: 6px 12px; font-size: 16px; color: #e0e0ff; margin: 3px; display: inline-block;">${tool}</span>`).join('')}
                                        </div>
                                    </div>
                                    <div style="margin-bottom: 15px;">
                                        <strong style="color: #ffd0b8;">Cost:</strong> ${comparison.euler.cost}
                                    </div>
                                    <div>
                                        <strong style="color: #ffd0b8;">Pattern:</strong> ${comparison.euler.pattern}
                                    </div>
                                </div>
                            </div>
                            <div class="concept-box purple" style="margin-top: 30px;">
                                <div class="concept-title">
                                    <i class="material-icons">compare_arrows</i>
                                    Spectral Efficiency Comparison
                                </div>
                                <div style="font-size: 16px; color: #ccccff; line-height: 1.6;">
                                    ${insights.map(insight => `• ${insight}`).join('<br>')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            generateFinalContent(content) {
                const { questions, callToAction } = content;
                return `
                    <div class="main-content">
                        <div class="left-column">
                            <div class="concept-box">
                                <div class="concept-title">
                                    <i class="material-icons">psychology</i>
                                    Profound Questions
                                </div>
                                ${questions.map(question => `
                                    <div style="font-size: 20px; color: #e0e0ff; margin-bottom: 15px; display: flex; align-items: flex-start;">
                                        <i class="material-icons" style="color: #ff9e6b; margin-right: 10px; font-size: 20px; margin-top: 3px;">help_outline</i>
                                        <span>${question}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="concept-box orange" style="margin-top: 20px;">
                                <div class="concept-title orange">
                                    <i class="material-icons">explore</i>
                                    ${callToAction.title}
                                </div>
                                <div class="key-points">
                                    ${callToAction.points.map(point => `
                                        <div class="key-point">
                                            <i class="material-icons">${point.icon}</i>
                                            ${point.text}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="right-column">
                            <div class="image-container">
                                <img src="${content.image}" alt="Mathematical universe visualization" loading="lazy">
                            </div>
                        </div>
                    </div>
                `;
            }

            setupEventListeners() {
                // Navigation buttons
                document.getElementById('prevBtn').addEventListener('click', () => this.previousSlide());
                document.getElementById('nextBtn').addEventListener('click', () => this.nextSlide());
                document.getElementById('playBtn').addEventListener('click', () => this.togglePlay());

                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    switch(e.key) {
                        case 'ArrowLeft':
                            e.preventDefault();
                            this.previousSlide();
                            break;
                        case 'ArrowRight':
                            e.preventDefault();
                            this.nextSlide();
                            break;
                        case ' ':
                            e.preventDefault();
                            this.togglePlay();
                            break;
                        case 'Home':
                            e.preventDefault();
                            this.goToSlide(0);
                            break;
                        case 'End':
                            e.preventDefault();
                            this.goToSlide(this.totalSlides - 1);
                            break;
                    }
                });

                // Click navigation
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.nav-container') && !e.target.closest('button')) {
                        const rect = window.innerWidth;
                        if (e.clientX > rect / 2) {
                            this.nextSlide();
                        } else {
                            this.previousSlide();
                        }
                    }
                });
            }

            showSlide(index) {
                // Remove all active classes
                document.querySelectorAll('.slide').forEach(slide => {
                    slide.classList.remove('active', 'next', 'prev');
                });

                // Add active class to current slide
                const currentSlideEl = document.getElementById(`slide-${index}`);
                if (currentSlideEl) {
                    currentSlideEl.classList.add('active');
                }

                // Add preview classes to adjacent slides
                if (index > 0) {
                    const prevSlideEl = document.getElementById(`slide-${index - 1}`);
                    if (prevSlideEl) prevSlideEl.classList.add('prev');
                }
                if (index < this.totalSlides - 1) {
                    const nextSlideEl = document.getElementById(`slide-${index + 1}`);
                    if (nextSlideEl) nextSlideEl.classList.add('next');
                }

                this.currentSlide = index;
                this.updateUI();
            }

            nextSlide() {
                if (this.currentSlide < this.totalSlides - 1) {
                    this.showSlide(this.currentSlide + 1);
                }
            }

            previousSlide() {
                if (this.currentSlide > 0) {
                    this.showSlide(this.currentSlide - 1);
                }
            }

            goToSlide(index) {
                if (index >= 0 && index < this.totalSlides) {
                    this.showSlide(index);
                }
            }

            togglePlay() {
                if (this.isPlaying) {
                    this.stopPlay();
                } else {
                    this.startPlay();
                }
            }

            startPlay() {
                this.isPlaying = true;
                document.getElementById('playBtn').innerHTML = '<i class="material-icons">pause</i>';
                this.playInterval = setInterval(() => {
                    if (this.currentSlide < this.totalSlides - 1) {
                        this.nextSlide();
                    } else {
                        this.stopPlay();
                    }
                }, this.playSpeed);
            }

            stopPlay() {
                this.isPlaying = false;
                document.getElementById('playBtn').innerHTML = '<i class="material-icons">play_arrow</i>';
                if (this.playInterval) {
                    clearInterval(this.playInterval);
                    this.playInterval = null;
                }
            }

            updateUI() {
                // Update progress bar
                const progress = ((this.currentSlide + 1) / this.totalSlides) * 100;
                document.getElementById('progressBar').style.width = `${progress}%`;

                // Update slide counter
                document.getElementById('slideCounter').textContent = `${this.currentSlide + 1} / ${this.totalSlides}`;

                // Update navigation buttons
                document.getElementById('prevBtn').disabled = this.currentSlide === 0;
                document.getElementById('nextBtn').disabled = this.currentSlide === this.totalSlides - 1;
            }
        }

        // Initialize the presentation when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new SpectralLogicPresentation();
        });
    </script>
</body>
</html>
