site_name: ShunyaBar Labs
site_url: https://sethuiyer.github.io/docs
site_description: The Arithmetic Manifold - Physics-inspired optimization and constraint satisfaction
site_author: Sethurathienam Iyer
docs_dir: src
site_dir: docs
exclude_docs: |
  MATH_STOP_TBD.md

hooks:
  - hooks/search_pagerank.py
  - hooks/recent_articles.py

theme:
  name: material
  custom_dir: overrides
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Blog:
    - Navokoj Launch: blog/navokoj-launch.md
    - Road to Enterprise: blog/navokoj-road-to-enterprise.md
    - Seven Seals: blog/seven-seals-navokoj.md
    - Six Research Tribes: blog/six-research-tribes.md
  - Research Report: research-report.md
  - Core Vision:
    - The Arithmetic Manifold: core-vision.md
    - Axiom Architecture: axiom-architecture.md
    - Concepts:
      - Partition Function: concepts/partition-function.md
      - Prime Weighting: concepts/prime-weighting.md
      - Multiplicative vs Additive: concepts/multiplicative-vs-additive.md
      - Agentic AI as Distributed Systems: concepts/agentic-ai-distributed-systems.md
      - Prime Euler Activations: concepts/prime-euler-activations.md
      - Phase Transitions: concepts/phase-transitions.md
      - Riemann Hypothesis: concepts/riemann-hypothesis.md
      - Asymptotically Fair Stopping: concepts/asymptotically-fair-stopping.md
      - STOP Operators as Resolution Flows: concepts/stop-operator-manuscript.md
  - Projects:
    - Projects Overview: projects/index.md
    - BAHA: projects/baha.md
    - NitroSAT: projects/nitrosat.md
    - Navokoj: projects/navokoj.md
    - Multiplicative PINN: projects/multiplicative-pinn.md
    - Spectral Multiplicative Framework: projects/spectral-multiplicative.md
    - Geometry of Conditional Logic: projects/geometry-of-conditional-logic.md
    - Casimir SAT Solver: projects/casimir-sat-solver.md
    - Factor Agent: projects/factor-agent.md
    - Thermodynamic Number Line: projects/thermodynamic-number-line.md
    - Authorization Lattice: projects/authorization-lattice.md
  - Marketing:
    - Why Navokoj: marketing/index.md
    - Use Cases: marketing/use-cases.md
    - Pricing: marketing/pricing.md
    - Results: marketing/results.md
    - Competition: marketing/competition.md
    - The Bottleneck: marketing/bottleneck.md
    - Pragmatist's Guide (Integrators): marketing/monetization-guide.md
    - Customer Monetization: marketing/customer-monetization.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Lua Module: getting-started/lua-module.md
    - Benchmarks: getting-started/benchmarks.md
  - Resources:
    - Navokoj Developer Guide: navokoj/index.md
    - Product Strategy: product-strategy.md
    - Papers: references/papers.md
    - Related Work: references/related-work.md
    - Limitations & Boundaries: limitations.md
    - Roadmap (Post-Funding): TODO.md
    - Glossary: glossary.md
    - Design Philosophy: design-philosophy.md
  - Zenodo:
    - All Records: zenodo/index.md
    - Casimir SAT Solver: zenodo/solving-sat-quantum-vacuum-dynamics.md
    - Spectral-Multiplicative Framework: zenodo/spectral-multiplicative-framework.md
    - ShunyaBar Spectral–Arithmetic: zenodo/shunyabar-spectral-arithmetic-phase-transitions.md
    - Multiplicative Calculus BAHA: zenodo/multiplicative-calculus-hardness-detection.md
    - NitroSAT: zenodo/nitrosat-physics-informed-maxsat.md
    - Emergent Stochasticity: zenodo/emergent-stochasticity-serialized-concurrency.md

markdown_extensions:
  - meta
  - tables
  - footnotes
  - def_list
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.betterem
  - pymdownx.keys

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - stylesheets/extra.css
