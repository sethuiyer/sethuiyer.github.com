site_name: ShunyaBar Labs
site_url: https://shunyabar.dev
site_description: The Arithmetic Manifold - Physics-inspired optimization and constraint satisfaction
site_author: Sethurathienam Iyer
docs_dir: src
site_dir: docs

theme:
  name: material
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Core Vision:
    - The Arithmetic Manifold: core-vision.md
    - Concepts:
      - Partition Function: concepts/partition-function.md
      - Prime Weighting: concepts/prime-weighting.md
      - Multiplicative vs Additive: concepts/multiplicative-vs-additive.md
      - Phase Transitions: concepts/phase-transitions.md
      - Riemann Hypothesis: concepts/riemann-hypothesis.md
  - Projects:
    - Projects Overview: projects/index.md
    - BAHA: projects/baha.md
    - NitroSAT: projects/nitrosat.md
    - Navokoj: projects/navokoj.md
    - Multiplicative PINN: projects/multiplicative-pinn.md
    - Spectral Multiplicative Framework: projects/spectral-multiplicative.md
    - Geometry of Conditional Logic: projects/geometry-of-conditional-logic.md
    - Casimir SAT Solver: projects/casimir-sat-solver.md
    - Factor Agent: projects/factor-agent.md
    - Thermodynamic Number Line: projects/thermodynamic-number-line.md
    - Authorization Lattice: projects/authorization-lattice.md
  - Marketing:
    - Why Navokoj: marketing/index.md
    - Use Cases: marketing/use-cases.md
    - Pricing: marketing/pricing.md
    - Results: marketing/results.md
    - Competition: marketing/competition.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Lua Module: getting-started/lua-module.md
    - Benchmarks: getting-started/benchmarks.md
  - Resources:
    - Navokoj Developer Guide: navokoj/index.md
    - Papers: references/papers.md
    - Related Work: references/related-work.md
    - Limitations & Boundaries: limitations.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - stylesheets/extra.css
